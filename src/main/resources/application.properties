spring.application.name=student-topic-management
spring.thymeleaf.cache=false
server.port=8080
# Cho phép đặt vị trí lưu dữ liệu độc lập với mã nguồn; đường dẫn mặc định phù hợp bản demo chạy cục bộ.
app.data-file=${APP_DATA_FILE:data/student-topic-data.json}
# Kho tài khoản tách biệt để thao tác quản trị không ghi đè dữ liệu đề tài.
app.accounts-file=${APP_ACCOUNTS_FILE:data/student-topic-accounts.json}
